<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                template="/template.xhtml"
                xmlns:p="primefaces"
                xmlns:si="jakarta.faces.composite/sicomp">
    <ui:param name="titulo" value="Gerenciar Produtos"></ui:param>
    <h:form id="formProduto" enctype="multipart/form-data">
        <si:toolbarCrud crudBean="#{produtoController}"></si:toolbarCrud>

        <!-- Formulário (novo / editar) -->
        <p:panelGrid columns="2" layout="tabular" styleClass="form-grid"
                     rendered="#{not produtoController.listando}">
            <p:outputLabel for="nome" value="Nome *"></p:outputLabel>
            <p:inputText id="nome" value="#{produtoController.entidade.nome}" maxlength="150" size="50"
                         required="true" requiredMessage="O nome do produto é obrigatório."></p:inputText>

            <p:outputLabel for="descricao" value="Descrição"></p:outputLabel>
            <p:inputTextarea id="descricao" value="#{produtoController.entidade.descricao}"
                             rows="4" cols="60" autoResize="false"></p:inputTextarea>

            <p:outputLabel for="preco" value="Preço (R$) *"></p:outputLabel>
            <p:inputNumber id="preco" value="#{produtoController.entidade.preco}" symbol="R$ " symbolPosition="p"
                           decimalSeparator="," thousandSeparator="." decimalPlaces="2" minValue="0.01"
                           maxValue="9999999999.99" required="true"
                           requiredMessage="O preço é obrigatório e deve ser maior que zero."></p:inputNumber>

            <p:outputLabel for="estoque" value="Estoque *"></p:outputLabel>
            <p:spinner id="estoque" value="#{produtoController.entidade.quantidadeEstoque}" min="0" max="1000000"
                       required="true" requiredMessage="Informe a quantidade em estoque (mínimo 0)."></p:spinner>

            <p:outputLabel for="marca" value="Marca *"></p:outputLabel>
            <p:selectOneMenu id="marca" value="#{produtoController.entidade.marca}" filter="true"
                             filterMatchMode="contains" style="min-width:340px"
                             required="true" requiredMessage="Selecione a marca do produto.">
                <f:selectItem itemLabel="Selecione a marca" itemValue="#{null}" noSelectionOption="true"></f:selectItem>
                <f:selectItems value="#{produtoController.marcas}" var="m"
                               itemLabel="#{m.nome}#{m.ativo ? '' : ' (inativa)'}" itemValue="#{m}"></f:selectItems>
            </p:selectOneMenu>

            <p:outputLabel for="categoria" value="Categoria *"></p:outputLabel>
            <p:selectOneMenu id="categoria" value="#{produtoController.entidade.categoria}" filter="true"
                             filterMatchMode="contains" style="min-width:340px"
                             required="true" requiredMessage="Selecione a categoria do produto.">
                <f:selectItem itemLabel="Selecione a categoria" itemValue="#{null}" noSelectionOption="true"></f:selectItem>
                <f:selectItems value="#{produtoController.categorias}" var="c"
                               itemLabel="#{c.nomeIndentado}" itemValue="#{c}"></f:selectItems>
            </p:selectOneMenu>

            <p:outputLabel value="Imagem"></p:outputLabel>
            <h:panelGroup>
                <p:fileUpload id="upload" mode="advanced" auto="true" dragDropSupport="true" multiple="false"
                              label="Selecionar imagem"
                              fileUploadListener="#{produtoController.upload}"
                              allowTypes="/(\.|\/)(jpe?g|png|webp)$/i" sizeLimit="2097152"
                              invalidFileMessage="Tipo de arquivo inválido. Envie JPG, PNG ou WEBP."
                              invalidSizeMessage="Arquivo muito grande. O limite é 2 MB."
                              process="@this" update="previaImagem"></p:fileUpload>
                <p:outputPanel id="previaImagem" styleClass="previa-imagem">
                    <p:graphicImage value="/imagens/#{produtoController.caminhoPreview}"
                                    rendered="#{not empty produtoController.caminhoPreview}"
                                    styleClass="preview-img" alt="Pré-visualização da imagem"></p:graphicImage>
                    <p:commandButton value="Remover imagem" icon="pi pi-times" styleClass="ui-button-danger ui-button-outlined"
                                     rendered="#{not empty produtoController.caminhoPreview}"
                                     actionListener="#{produtoController.removerImagem()}" process="@this" update="previaImagem">
                    </p:commandButton>
                    <h:outputText rendered="#{empty produtoController.caminhoPreview}" styleClass="contador"
                                  value="Nenhuma imagem selecionada (JPG, PNG ou WEBP - máx. 2 MB)."></h:outputText>
                </p:outputPanel>
            </h:panelGroup>
        </p:panelGrid>

        <!-- Listagem -->
        <p:dataTable id="tabela" widgetVar="tabelaProdutos" var="p" value="#{produtoController.entidades}"
                     rendered="#{produtoController.listando}" paginator="true" rows="10"
                     rowsPerPageTemplate="5,10,20,50" paginatorPosition="bottom" reflow="true"
                     emptyMessage="Nenhum produto encontrado." rowKey="#{p.id}" sortMode="single">
            <p:column headerText="Imagem" style="width:90px; text-align:center">
                <p:graphicImage value="/imagens/#{p.caminhoImagem}" rendered="#{not empty p.caminhoImagem}"
                                styleClass="thumb" alt="#{p.nome}"></p:graphicImage>
                <i class="pi pi-image sem-imagem" title="Sem imagem" style="#{not empty p.caminhoImagem ? 'display:none' : ''}"></i>
            </p:column>
            <p:column headerText="Nome" sortBy="#{p.nome}" filterBy="#{p.nome}" filterMatchMode="contains">
                <h:outputText value="#{p.nome}"></h:outputText>
            </p:column>
            <p:column headerText="Marca" sortBy="#{p.marca.nome}" filterBy="#{p.marca.nome}" filterMatchMode="contains">
                <h:outputText value="#{p.marca.nome}"></h:outputText>
            </p:column>
            <p:column headerText="Categoria" sortBy="#{p.categoria.caminho}" filterBy="#{p.categoria.caminho}" filterMatchMode="contains">
                <h:outputText value="#{p.categoria.caminho}"></h:outputText>
            </p:column>
            <p:column headerText="Preço" sortBy="#{p.preco}" style="width:120px; text-align:right">
                <h:outputText value="#{p.preco}">
                    <f:convertNumber type="currency" currencySymbol="R$" locale="pt_BR"></f:convertNumber>
                </h:outputText>
            </p:column>
            <p:column headerText="Estoque" sortBy="#{p.quantidadeEstoque}" style="width:100px; text-align:center">
                <h:outputText value="#{p.quantidadeEstoque}"></h:outputText>
            </p:column>
            <p:column headerText="Ações" style="width:120px; text-align:center">
                <p:commandButton icon="pi pi-pencil" title="Editar" styleClass="rounded-button ui-button-warning"
                                 actionListener="#{produtoController.editar(p)}" process="@this" update="@form">
                </p:commandButton>
                <p:spacer width="4px"></p:spacer>
                <p:commandButton icon="pi pi-trash" title="Excluir" styleClass="rounded-button ui-button-danger"
                                 actionListener="#{produtoController.excluir(p)}" process="@this" update="@form">
                    <p:confirm header="Confirmar exclusão" message="Deseja realmente excluir o produto '#{p.nome}'?" icon="pi pi-exclamation-triangle"></p:confirm>
                </p:commandButton>
            </p:column>
        </p:dataTable>

        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="430">
            <p:commandButton value="Sim, excluir" type="button" styleClass="ui-confirmdialog-yes ui-button-danger" icon="pi pi-check"></p:commandButton>
            <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no ui-button-secondary" icon="pi pi-times"></p:commandButton>
        </p:confirmDialog>
    </h:form>
</ui:composition>
